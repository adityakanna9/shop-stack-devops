
name: Shop Stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f client/Dockerfile
          test -f client/package.json
          test -f server/Dockerfile
          test -f server/package.json
          test -f server/server.js

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t shop-frontend:latest ./client

      - name: Build API image
        run: docker build -t shop-api:latest ./server
